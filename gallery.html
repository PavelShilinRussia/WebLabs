<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="Gallery of Pasha Shilin's photos and images.">
    <meta name="keywords" content="portfolio, gallery, photos, Pasha Shilin">
    <link rel="stylesheet" href="css/style.css">
    <!-- Swiper.js CSS -->
    <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css">
    <script src="js/script.js" defer></script>
    <script src="js/gallery-swipe.js" defer></script>
    <title>Gallery - Pasha Shilin</title>
    <style>

.main {
    flex: 1; 

    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
}
    </style>
</head>

<body>
    <!-- Header Section with Navigation -->
    <header class="header">
        <h1 class="header__title">Pasha Shilin</h1>
        <nav class="header__nav">
            <ul class="header__menu menu">
                <li class="menu__item"><a href="index.html" class="menu__link" id="about-link">About Me</a></li>
                <li class="menu__item"><a href="gallery.html" class="menu__link" id="gallery-link">Gallery</a></li>
                <li class="menu__item"><a href="projects.html" class="menu__link" id="projects-link">Projects</a></li>
                <li class="menu__item"><a href="contact.html" class="menu__link" id="contact-link">Contact</a></li>
                <li class="menu__item"><a href="constructor.html" class="menu__link">Constructor</a></li>
            </ul>
        </nav>
    </header>

    <main class="main">
        <section id="gallery" class="section gallery" style="Overflow: hidden">
            <h2 class="section__title">Gallery</h2>
            <!-- Swiper Container -->
            <div class="swiper-container">
                <div class="swiper-wrapper" >
                    <div class="swiper-slide" style="margin-right: 5px;" style="margin-left: 5px;">
                        <img src="img/ph1.jpg" alt="Image 1" >
                    </div>
                    <div class="swiper-slide" style="margin-right: 5px;" style="margin-left: 5px;">
                        <img src="img/ph2.jpg" alt="Image 2" >
                    </div>
                    <div class="swiper-slide" style="margin-right: 5px;" style="margin-left: 5px;">
                        <img src="img/ph3.jpg" alt="Image 3" >
                    </div>
                </div>
                <div class="swiper-button-next"></div>
                <div class="swiper-button-prev"></div>
                <!-- Add Pagination -->
                <div class="swiper-pagination"></div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p class="footer__text">2024 Pasha Shilin's Portfolio</p>
    </footer>

    <!-- Swiper.js JS -->
    <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
    <script src="js/gallery-swiper.js" defer></script>
</body>

</html>
